<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😭 Memes — $CRYING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020408;
  --blue: #5b9cf6;
  --blue-dim: rgba(91,156,246,0.09);
  --text: #f0eee8;
  --text-dim: rgba(200,212,235,0.42);
  --gold: #d4a843;
  --rule: rgba(91,156,246,0.14);
}
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg); overflow-x:hidden; cursor:none;
  font-family:'Cormorant','Georgia',serif;
}

/* Film grain */
body::after {
  content:''; position:fixed; inset:0; z-index:998; pointer-events:none; opacity:.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;
}

/* Canvas */
#c { position:fixed; inset:0; z-index:0; }

/* ── Cursor ── */
#cursor {
  position:fixed; z-index:9999; pointer-events:none;
  transform:translate(-50%,-50%); mix-blend-mode:difference;
}
#cursor-dot {
  width:7px; height:7px; border-radius:50%; background:#fff;
  transition:transform .12s ease;
}
#cursor-ring {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:30px; height:30px; border-radius:50%;
  border:1px solid rgba(255,255,255,.26);
  transition:width .2s ease, height .2s ease;
}
body.clicking #cursor-dot { transform:scale(2.2); }
body.clicking #cursor-ring { width:46px; height:46px; }

/* ── Top-right link banner ── */
#top-links {
  position:fixed; top:24px; right:24px; z-index:100;
  display:flex; gap:10px; align-items:center; pointer-events:all;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 10px rgba(91,156,246,0.3), 0 0 24px rgba(91,156,246,0.12), 0 2px 12px rgba(0,0,0,0.6); }
  50%       { box-shadow: 0 0 18px rgba(91,156,246,0.6), 0 0 40px rgba(91,156,246,0.22), 0 2px 12px rgba(0,0,0,0.6); }
}
.top-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 20px; min-width:130px;
  font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:.18em; text-transform:uppercase;
  text-decoration:none; white-space:nowrap; font-weight:700;
  border-radius:40px;
  border:1px solid rgba(91,156,246,0.55);
  background:rgba(91,156,246,0.12);
  color:var(--text);
  backdrop-filter:blur(16px) saturate(1.8);
  -webkit-backdrop-filter:blur(16px) saturate(1.8);
  animation:pulse-glow 2.8s ease-in-out infinite;
  transition:color .2s, border-color .2s, background .2s, transform .2s;
}
.top-btn:nth-child(2) { animation-delay:.6s; }
.top-btn svg { flex-shrink:0; transition:opacity .2s; }
.top-btn:hover {
  color:#fff;
  border-color:rgba(91,156,246,1);
  background:rgba(91,156,246,0.28);
  box-shadow:0 0 28px rgba(91,156,246,0.5), 0 0 60px rgba(91,156,246,0.2), 0 4px 16px rgba(0,0,0,0.7) !important;
  transform:translateY(-2px) scale(1.03);
  animation:none;
}
.top-btn:hover svg { opacity:1; }

/* ── Page layout ── */
#page-wrap {
  position:relative; z-index:1;
  min-height:100vh;
}

/* ── Hero / CRY-IFY section ── */
.memes-hero {
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:100px 24px 60px;
}
.memes-hero-tag {
  font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:.42em;
  text-transform:uppercase; color:var(--blue); margin-bottom:18px;
  opacity:.7;
}
.memes-hero-title {
  font-family:'Cormorant',serif; font-size:clamp(2.4rem,8vw,5rem);
  font-weight:300; letter-spacing:-.02em; color:var(--text);
  text-align:center; margin-bottom:48px; line-height:1.1;
}
.memes-hero-title em { font-style:normal; font-weight:700; color:var(--blue); }

/* ── CRY-IFY styles (same as index.html) ── */
.cryify-layout {
  display:flex; flex-direction:column; gap:16px; max-width:720px; width:100%;
  pointer-events:all;
}

/* URL bar */
.cryify-url-bar {
  transform:translateY(22px); opacity:0;
  transition:transform .9s cubic-bezier(.16,1,.3,1), opacity .85s;
}
.cryify-url-bar.visible { transform:translateY(0); opacity:1; }
.cryify-url-input-wrap {
  display:flex; align-items:center; gap:14px;
  padding:11px 20px;
  border:1px solid var(--rule);
  background:rgba(91,156,246,0.03);
}
.cryify-url-label {
  font-family:'Space Mono',monospace; font-size:.46rem; letter-spacing:.36em;
  text-transform:uppercase; color:var(--text-dim); flex-shrink:0;
}
.cryify-url-input {
  background:none; border:none; outline:none;
  font-family:'Space Mono',monospace; font-size:.56rem; letter-spacing:.08em;
  color:var(--text); flex:1; min-width:0;
  user-select:text; -webkit-user-select:text; cursor:text;
}
.cryify-status {
  font-family:'Space Mono',monospace; font-size:.48rem; letter-spacing:.14em;
  flex-shrink:0; transition:color .3s;
}
.cryify-status--checking { color:var(--text-dim); }
.cryify-status--online   { color:#5bc8a0; }
.cryify-status--offline  { color:#f05b6a; }

/* Card */
.cryify-card {
  border:1px solid var(--rule);
  background:rgba(2,4,8,0.85);
  padding:28px; display:flex; flex-direction:column; gap:22px;
  backdrop-filter:blur(24px);
  transform:translateY(22px); opacity:0;
  transition:transform .9s .12s cubic-bezier(.16,1,.3,1), opacity .85s .12s;
}
.cryify-card.visible { transform:translateY(0); opacity:1; }

/* Drop zone */
.cryify-drop {
  position:relative; border:1px dashed rgba(91,156,246,0.3);
  min-height:190px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; overflow:hidden;
  transition:border-color .3s, background .3s, aspect-ratio .3s;
}
.cryify-drop.has-image { min-height:unset; }
.cryify-drop:hover, .cryify-drop.drag-over {
  border-color:rgba(91,156,246,0.65); background:rgba(91,156,246,0.04);
}
.cryify-drop-inner { text-align:center; pointer-events:none; padding:20px; }
.cryify-drop-icon {
  font-size:2.8rem; display:block; margin-bottom:10px;
  animation:cryify-float 3.2s ease-in-out infinite;
}
@keyframes cryify-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.cryify-drop-text {
  font-family:'Cormorant',serif; font-size:1rem; color:var(--text-dim);
  font-style:italic; line-height:1.75;
}
.cryify-preview {
  width:100%; height:100%; object-fit:contain;
  position:absolute; inset:0;
}
.cryify-change-pill {
  position:absolute; top:10px; right:10px;
  padding:5px 13px; border:1px solid var(--rule);
  font-family:'Space Mono',monospace; font-size:.44rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-dim); background:rgba(2,4,8,0.75); cursor:pointer;
  transition:border-color .2s, color .2s;
}
.cryify-change-pill:hover { border-color:rgba(91,156,246,.5); color:var(--text); }

/* Controls */
.cryify-controls { display:flex; flex-direction:column; gap:16px; }
.cryify-control-row { display:flex; align-items:center; gap:18px; }
.cryify-control-label {
  font-family:'Space Mono',monospace; font-size:.48rem; letter-spacing:.3em;
  text-transform:uppercase; color:var(--text-dim); flex-shrink:0; width:76px;
}
.cryify-chips { display:flex; gap:7px; flex-wrap:wrap; }
.cryify-chip {
  padding:6px 15px; border:1px solid var(--rule); background:none;
  font-family:'Space Mono',monospace; font-size:.46rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-dim); cursor:pointer;
  transition:border-color .2s, color .2s, background .2s;
}
.cryify-chip:hover { border-color:rgba(91,156,246,.4); color:var(--text); }
.cryify-chip.active {
  border-color:var(--blue); color:var(--blue); background:rgba(91,156,246,0.1);
}
.cryify-slider-wrap { display:flex; align-items:center; gap:14px; flex:1; }
.cryify-slider {
  flex:1; -webkit-appearance:none; appearance:none; height:1px;
  background:var(--rule); outline:none; pointer-events:all;
}
.cryify-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--blue); cursor:pointer;
  box-shadow:0 0 10px rgba(91,156,246,0.65);
}
.cryify-intensity-val {
  font-family:'Space Mono',monospace; font-size:1.1rem; color:var(--text);
  font-weight:700; width:34px; text-align:right; letter-spacing:-.04em;
}

/* Error */
.cryify-error {
  padding:11px 16px; border:1px solid rgba(240,91,106,0.35);
  background:rgba(240,91,106,0.06);
  font-family:'Space Mono',monospace; font-size:.5rem; letter-spacing:.1em; color:#f05b6a;
}

/* Submit */
@keyframes cryify-shimmer { to { left:150%; } }
.cryify-submit {
  align-self:flex-start; padding:17px 42px;
  background:var(--blue); color:#000;
  font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:.22em; text-transform:uppercase;
  font-weight:700; border:none; cursor:pointer;
  position:relative; overflow:hidden;
}
.cryify-submit:disabled { opacity:.3; }
.cryify-submit:not(:disabled):hover { background:#88ccff; }
.cryify-submit::after {
  content:''; position:absolute; top:0; left:-100%; width:55%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
}
.cryify-submit:not(:disabled):hover::after { animation:cryify-shimmer .5s forwards; }

/* Generating */
.cryify-generating { align-items:center; text-align:center; padding:52px 34px; min-height:320px; justify-content:center; }
.cryify-gen-emoji {
  font-size:4.5rem; display:block; margin-bottom:22px;
  animation:cryify-sob .65s ease-in-out infinite alternate;
}
@keyframes cryify-sob {
  from { transform:scale(1) rotate(-3deg); filter:drop-shadow(0 0 18px rgba(91,156,246,0.4)); }
  to   { transform:scale(1.08) rotate(3deg); filter:drop-shadow(0 0 38px rgba(91,156,246,0.8)); }
}
.cryify-gen-status {
  font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:.26em;
  text-transform:uppercase; color:var(--blue); margin-bottom:22px; min-height:1.4em;
  animation:cryify-blink 1.6s ease-in-out infinite;
}
@keyframes cryify-blink { 0%,100%{opacity:.45} 50%{opacity:1} }
.cryify-progress-bar {
  width:100%; max-width:360px; height:1px;
  background:rgba(91,156,246,0.14); overflow:hidden;
}
.cryify-progress-fill {
  height:100%; width:0%;
  background:linear-gradient(to right, rgba(91,156,246,0.4), var(--blue));
  transition:width .4s ease;
}

/* Before / After */
.cryify-before-after { display:flex; align-items:flex-start; gap:18px; }
.cryify-ba-col { display:flex; flex-direction:column; gap:9px; flex:1; }
.cryify-ba-label {
  font-family:'Space Mono',monospace; font-size:.48rem; letter-spacing:.32em;
  text-transform:uppercase; color:var(--text-dim);
}
.cryify-ba-img {
  width:100%; object-fit:contain; border:1px solid var(--rule); display:block;
  background:rgba(0,0,0,0.4);
}
.cryify-ba-img--after {
  border-color:rgba(91,156,246,0.5);
  box-shadow:0 0 22px rgba(91,156,246,0.18), 0 0 60px rgba(91,156,246,0.08);
}
.cryify-arrow {
  font-size:1.4rem; color:var(--blue); flex-shrink:0;
  animation:cryify-arrow 1.3s ease-in-out infinite;
}
@keyframes cryify-arrow { 0%,100%{opacity:.3; transform:translateX(0)} 50%{opacity:1; transform:translateX(5px)} }

/* Analysis */
.cryify-analysis {
  padding:14px 18px; border-left:2px solid rgba(91,156,246,0.45);
  background:rgba(91,156,246,0.04);
  font-family:'Cormorant',serif; font-size:.95rem; color:var(--text-dim);
  font-style:italic; line-height:1.85;
}
.cryify-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.cryify-pill {
  padding:3px 12px; border:1px solid rgba(91,156,246,0.3);
  font-family:'Space Mono',monospace; font-size:.44rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--blue);
}

/* Result actions */
.cryify-result-actions { display:flex; gap:9px; flex-wrap:wrap; }
.cryify-action-btn {
  padding:11px 20px; border:1px solid var(--rule); background:none;
  font-family:'Space Mono',monospace; font-size:.48rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-dim); cursor:pointer;
  transition:border-color .2s, color .2s, background .2s;
}
.cryify-action-btn:hover { border-color:rgba(91,156,246,.4); color:var(--text); }
.cryify-action-btn--primary {
  background:var(--blue); color:#000; border-color:var(--blue);
}
.cryify-action-btn--primary:hover { background:#88ccff; border-color:#88ccff; color:#000; }

/* Toast */
.cryify-toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  padding:10px 22px;
  border:1px solid var(--rule); background:rgba(2,4,8,0.92);
  font-family:'Space Mono',monospace; font-size:.5rem; letter-spacing:.14em; color:var(--text);
  opacity:0; transition:opacity .25s, transform .25s;
  z-index:9000; pointer-events:none;
}
.cryify-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── Feed section ── */
.feed-section {
  position:relative; z-index:1;
  padding:80px 24px 120px;
  max-width:1200px; margin:0 auto;
}
.feed-title {
  font-family:'Cormorant',serif; font-size:clamp(1.8rem,5vw,3rem);
  font-weight:300; color:var(--text); margin-bottom:40px;
  border-bottom:1px solid var(--rule); padding-bottom:28px;
}
.feed-title em { font-style:normal; font-weight:700; color:var(--blue); }

.feed-empty {
  text-align:center; padding:80px 24px;
  font-family:'Cormorant',serif; font-size:1.3rem; font-style:italic;
  color:var(--text-dim); line-height:1.9;
}
.feed-empty-icon { font-size:3.5rem; display:block; margin-bottom:18px; opacity:.5; }

.feed-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:16px;
}

@keyframes feed-fade-in {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}

.feed-item {
  border:1px solid var(--rule);
  background:rgba(2,4,8,0.82);
  backdrop-filter:blur(12px);
  overflow:hidden;
  animation:feed-fade-in .45s ease forwards;
  cursor:pointer;
  transition:border-color .25s, box-shadow .25s, transform .2s;
}
.feed-item:hover {
  border-color:rgba(91,156,246,0.5);
  box-shadow:0 0 28px rgba(91,156,246,0.18);
  transform:translateY(-3px);
}
.feed-item-img-wrap { position:relative; overflow:hidden; }
.feed-item-img {
  width:100%; aspect-ratio:1; object-fit:cover; display:block;
  transition:filter .3s, transform .3s;
}
.feed-item:hover .feed-item-img { filter:saturate(1.15) brightness(1.05); transform:scale(1.03); }
.feed-item-overlay {
  position:absolute; inset:0;
  background:rgba(2,4,8,0.55);
  display:flex; align-items:center; justify-content:center; gap:12px;
  opacity:0; transition:opacity .22s;
  backdrop-filter:blur(2px);
}
.feed-item:hover .feed-item-overlay { opacity:1; }
.feed-overlay-btn {
  width:42px; height:42px; border-radius:50%;
  border:1px solid rgba(91,156,246,0.6);
  background:rgba(2,4,8,0.8);
  color:var(--blue); font-size:1rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:all;
  transition:background .15s, border-color .15s, transform .15s;
}
.feed-overlay-btn:hover { background:var(--blue); color:#000; transform:scale(1.1); }
.feed-item-meta {
  padding:10px 14px;
  display:flex; align-items:center; justify-content:space-between;
}
.feed-item-label {
  font-family:'Space Mono',monospace; font-size:.42rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--blue); opacity:.7;
}
.feed-item-time {
  font-family:'Space Mono',monospace; font-size:.42rem; letter-spacing:.1em;
  color:var(--text-dim);
}
.feed-item-dl {
  background:none; border:none; cursor:pointer; pointer-events:all;
  color:var(--text-dim); font-size:.85rem; padding:2px 4px;
  transition:color .15s; line-height:1;
}
.feed-item-dl:hover { color:var(--blue); }

/* ── Lightbox ── */
.lightbox {
  position:fixed; inset:0; z-index:9500;
  background:rgba(2,4,8,0.96);
  backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
  opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.lightbox.open { opacity:1; pointer-events:all; }
.lightbox-img {
  max-width:min(92vw, 860px); max-height:78vh;
  object-fit:contain; display:block;
  border:1px solid rgba(91,156,246,0.3);
  box-shadow:0 0 60px rgba(91,156,246,0.18), 0 0 120px rgba(91,156,246,0.07);
}
.lightbox-actions {
  display:flex; align-items:center; gap:14px;
}
.lightbox-close {
  position:fixed; top:22px; right:28px;
  background:none; border:1px solid rgba(91,156,246,0.3); color:var(--text-dim);
  font-family:'Space Mono',monospace; font-size:.5rem; letter-spacing:.18em;
  text-transform:uppercase; padding:8px 18px; cursor:pointer;
  transition:border-color .2s, color .2s;
}
.lightbox-close:hover { border-color:var(--blue); color:var(--text); }
.lightbox-dl {
  padding:12px 32px;
  background:var(--blue); color:#000;
  font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:.2em; text-transform:uppercase;
  font-weight:700; border:none; cursor:pointer;
  transition:background .2s;
}
.lightbox-dl:hover { background:#88ccff; }

/* ── Responsive ── */
@media (max-width: 768px) {
  #top-links { top:14px; right:14px; gap:6px; }
  .top-btn { padding:8px 12px; font-size:.42rem; gap:5px; min-width:100px; }

  .memes-hero { padding:90px 16px 40px; }
  .cryify-before-after { flex-direction:column; }
  .cryify-arrow { transform:rotate(90deg); display:block; text-align:center; }
  .cryify-control-row { flex-direction:column; align-items:flex-start; gap:10px; }
  .cryify-control-label { width:auto; }
  .cryify-submit { align-self:stretch; text-align:center; }
  .cryify-card { padding:16px; }

  /* Action buttons — 2-column grid on tablet */
  .cryify-result-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cryify-action-btn { padding:13px 10px; font-size:.44rem; text-align:center; }
  /* Try Another spans full width */
  .cryify-result-actions button:last-child { grid-column:1/-1; }

  /* GIF & video sections full width */
  #cryify-gif-section, #cryify-video-section { margin-top:14px; }
  #cryify-gif-player { border-radius:6px; }
  #cryify-gif-dl-wrap, #cryify-video-dl-wrap { margin-top:6px; }

  .feed-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
}

@media (pointer: coarse) {
  /* Restore cursor and always show feed overlay on touch devices */
  body { cursor:auto; }
  .feed-item-overlay { opacity:1; background:rgba(2,4,8,0.3); backdrop-filter:none; }
}
@media (max-width: 480px) {
  #top-links { flex-direction:column; align-items:flex-end; gap:6px; }
  #cursor { display:none; }
  body { cursor:auto; }

  /* Single column buttons on phones */
  .cryify-result-actions { grid-template-columns:1fr; }
  .cryify-result-actions button:last-child { grid-column:auto; }
  .cryify-action-btn { padding:14px 10px; font-size:.46rem; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕ Close</button>
  <img id="lightbox-img" class="lightbox-img" src="" alt="">
  <div class="lightbox-actions">
    <button class="lightbox-dl" id="lightbox-dl">💾 Download</button>
  </div>
</div>

<div id="cursor">
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';

// ─── Mobile detection ─────────────────────────────────────────────────────────
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || innerWidth <= 768;

// ─── Core ─────────────────────────────────────────────────────────────────────
let W = innerWidth, H = innerHeight;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.7;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 100);

window.addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  composer.setSize(W, H);
  ripplePass.uniforms.uResolution.value.set(W, H);
});

// ─── Post-processing ──────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.30, 0.4, 0.85);
composer.addPass(bloom);

// ─── Ripple + Chromatic Aberration ShaderPass ─────────────────────────────────
const MAX_RIPPLES = 10;
const rippleShader = {
  uniforms: {
    tDiffuse:    { value: null },
    uResolution: { value: new THREE.Vector2(W, H) },
    uMouse:      { value: new THREE.Vector2(0.5, 0.5) },
    uVelocity:   { value: 0.0 },
    uRipple:     { value: Array.from({length: MAX_RIPPLES}, () => new THREE.Vector2(0.5, 0.5)) },
    uRippleAge:  { value: new Float32Array(MAX_RIPPLES) },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2  uResolution;
    uniform vec2  uMouse;
    uniform float uVelocity;
    uniform vec2  uRipple[${MAX_RIPPLES}];
    uniform float uRippleAge[${MAX_RIPPLES}];
    varying vec2  vUv;

    void main() {
      vec2 uv = vUv;
      float aspect = uResolution.x / uResolution.y;
      vec2 distort = vec2(0.0);

      for (int i = 0; i < ${MAX_RIPPLES}; i++) {
        float age = uRippleAge[i];
        if (age <= 0.0 || age > 2.8) continue;
        vec2 diff = uv - uRipple[i];
        diff.x *= aspect;
        float dist = length(diff);
        float radius  = age * 0.55;
        float wave    = exp(-pow((dist - radius) / 0.055, 2.0));
        float fade    = pow(1.0 - age / 2.8, 1.6);
        float str     = 0.022 * wave * fade;
        distort += normalize(diff + 0.0001) * str;
      }

      float chroma = clamp(uVelocity * 0.0028, 0.0, 0.014);
      vec2 dir = (uMouse - vec2(0.5)) * 0.5;

      float r = texture2D(tDiffuse, clamp(uv + distort + dir * chroma, 0.0, 1.0)).r;
      float g = texture2D(tDiffuse, clamp(uv + distort,                0.0, 1.0)).g;
      float b = texture2D(tDiffuse, clamp(uv + distort - dir * chroma, 0.0, 1.0)).b;
      float a = texture2D(tDiffuse, clamp(uv + distort,                0.0, 1.0)).a;

      gl_FragColor = vec4(r, g, b, a);
    }
  `
};
const ripplePass = new ShaderPass(rippleShader);
ripplePass.enabled = !isMobile;
composer.addPass(ripplePass);
composer.addPass(new OutputPass());

// ─── Ripple state ─────────────────────────────────────────────────────────────
const ripplePositions = ripplePass.uniforms.uRipple.value;
const rippleAges      = ripplePass.uniforms.uRippleAge.value;
let   rippleIdx       = 0;
let   lastMouseX = 0, lastMouseY = 0, mouseVel = 0;
let   rippleSpawnTimer = 0;

window.addEventListener('mousemove', e => {
  const nx = e.clientX / W, ny = 1 - e.clientY / H;
  ripplePass.uniforms.uMouse.value.set(nx, ny);
  const dx = e.clientX - lastMouseX, dy = e.clientY - lastMouseY;
  mouseVel = Math.sqrt(dx*dx + dy*dy);
  lastMouseX = e.clientX; lastMouseY = e.clientY;
});

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const keyLight  = new THREE.DirectionalLight(0xfff8ee, 1.8); keyLight.position.set(-3, 4, 6);   scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.7); fillLight.position.set(4, -1, 4);  scene.add(fillLight);
const rimLight  = new THREE.DirectionalLight(0xffd060, 0.5); rimLight.position.set(0, -4, -3);  scene.add(rimLight);

// ─── Stars ────────────────────────────────────────────────────────────────────
{
  const n = 5000, p = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) p[i] = (Math.random() - .5) * 80;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xaaccff, size: .05, transparent: true, opacity: .65,
    blending: THREE.AdditiveBlending, depthWrite: false
  })));
}

// ─── 3D Emoji — GLB model ────────────────────────────────────────────────────
let emojiMesh = null;
{
  const group = new THREE.Group();
  scene.add(group);
  emojiMesh = group;

  new GLTFLoader().load('./uohh_emoji_crying_sob.glb', gltf => {
    const model = gltf.scene;
    const box  = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    model.scale.setScalar(3.4 / maxDim);
    box.setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.traverse(child => {
      if (!child.isMesh) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => {
        m.roughness    = Math.min(m.roughness ?? 0.3, 0.25);
        m.metalness    = m.metalness ?? 0;
        m.envMapIntensity = 1.5;
        if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) m.needsUpdate = true;
      });
    });
    model.rotation.y = -Math.PI / 2;
    group.add(model);
  }, undefined, err => console.error('GLB load error:', err));
}

// ─── Rain (LineSegments) ──────────────────────────────────────────────────────
const RAIN_N  = isMobile ? 600 : 2200;
const rPos    = new Float32Array(RAIN_N * 6);
const rSpeeds = new Float32Array(RAIN_N);
const WIND    = -0.06;

function resetRainDrop(i, randomY = false) {
  const x = (Math.random() - .5) * 22;
  const y = randomY ? (Math.random() - .5) * 22 : 14 + Math.random() * 8;
  const z = (Math.random() - .5) * 12;
  const len = 0.12 + Math.random() * 0.28;
  rPos[i*6+0] = x;         rPos[i*6+1] = y;       rPos[i*6+2] = z;
  rPos[i*6+3] = x + WIND;  rPos[i*6+4] = y - len; rPos[i*6+5] = z;
  rSpeeds[i]  = 0.07 + Math.random() * 0.14;
}
for (let i = 0; i < RAIN_N; i++) resetRainDrop(i, true);

const rGeo = new THREE.BufferGeometry();
rGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
const rainMesh = new THREE.LineSegments(rGeo, new THREE.LineBasicMaterial({
  color: 0x88bbff, transparent: true, opacity: .35,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(rainMesh);

// ─── Click burst particles ────────────────────────────────────────────────────
const BURST_N = 350;
const bActive = new Uint8Array(BURST_N);
const bPos    = new Float32Array(BURST_N * 3);
const bVel    = new Float32Array(BURST_N * 3);
const bLife   = new Float32Array(BURST_N);
const bMax    = new Float32Array(BURST_N);
bPos.fill(-999);
const bGeo = new THREE.BufferGeometry();
bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
scene.add(new THREE.Points(bGeo, new THREE.PointsMaterial({
  color: 0x88ccff, size: .12, transparent: true, opacity: .85,
  blending: THREE.AdditiveBlending, depthWrite: false
})));

function emitBurst(x, y, z, n) {
  let s = 0;
  for (let i = 0; i < BURST_N && s < n; i++) {
    if (bActive[i]) continue;
    bActive[i] = 1;
    bPos[i*3] = x; bPos[i*3+1] = y; bPos[i*3+2] = z;
    const spd = .03 + Math.random() * .14;
    const a1 = Math.random() * Math.PI * 2, a2 = Math.random() * Math.PI * 2;
    bVel[i*3]   = Math.cos(a1) * Math.sin(a2) * spd;
    bVel[i*3+1] = Math.sin(a1) * spd;
    bVel[i*3+2] = Math.cos(a2) * spd;
    bLife[i] = 0; bMax[i] = .6 + Math.random() * 1.4; s++;
  }
}

// ─── Shockwave ring ───────────────────────────────────────────────────────────
const shockwaves = [];
function addShockwave(pos) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(.01, .025, 12, 80),
    new THREE.MeshBasicMaterial({ color: 0xaaddff, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  m.position.copy(pos); m.lookAt(camera.position);
  scene.add(m); shockwaves.push({ m, life: 0 });
}

// ─── Fixed camera (no scroll keyframes needed on memes page) ─────────────────
const camTargetPos = new THREE.Vector3(0, .3, 5.5);
const camTargetTgt = new THREE.Vector3(0, 0, 0);
const camPos = camTargetPos.clone();
const camTgt = camTargetTgt.clone();

let drag = false, lx = 0, ly = 0, orbitTheta = 0, orbitPhi = Math.PI / 2;

// ─── Cursor ───────────────────────────────────────────────────────────────────
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
  if (drag) {
    orbitTheta += (e.clientX - lx) * .005;
    orbitPhi   += (e.clientY - ly) * .004;
    lx = e.clientX; ly = e.clientY;
  }
});
document.addEventListener('mousedown', e => {
  e.preventDefault(); drag = true; lx = e.clientX; ly = e.clientY;
  document.body.classList.add('clicking');
});
document.addEventListener('mouseup', () => {
  drag = false;
  document.body.classList.remove('clicking');
});

// ─── Touch ────────────────────────────────────────────────────────────────────
if (!isMobile) {
  document.addEventListener('touchstart', e => {
    if (e.target.closest('a, input, button, #top-links')) return;
    drag = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY;
    document.body.classList.add('clicking');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!drag) return;
    orbitTheta += (e.touches[0].clientX - lx) * .006;
    orbitPhi   += (e.touches[0].clientY - ly) * .005;
    lx = e.touches[0].clientX; ly = e.touches[0].clientY;
    ripplePass.uniforms.uMouse.value.set(lx / W, 1 - ly / H);
    const dx = e.touches[0].clientX - lastMouseX, dy = e.touches[0].clientY - lastMouseY;
    mouseVel = Math.sqrt(dx*dx + dy*dy);
    lastMouseX = lx; lastMouseY = ly;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    drag = false; document.body.classList.remove('clicking');
  });
}

// ─── Click → burst ────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.closest('a, input, button')) return;
  const ndc = new THREE.Vector2((e.clientX/W)*2-1, -(e.clientY/H)*2+1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3(); ray.ray.at(8, p);
  emitBurst(p.x, p.y, p.z, 55);
  addShockwave(p);
  ripplePositions[rippleIdx].set(e.clientX / W, 1 - e.clientY / H);
  rippleAges[rippleIdx] = 0.001;
  rippleIdx = (rippleIdx + 1) % MAX_RIPPLES;
});

// ─── Animation loop ───────────────────────────────────────────────────────────
const clock = new THREE.Clock();

(function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.getElapsedTime();

  camPos.lerp(camTargetPos, .06);
  camTgt.lerp(camTargetTgt, .06);
  const radius = camPos.distanceTo(camTgt);
  if (isMobile) orbitTheta += 0.012;
  const theta = orbitTheta + (isMobile ? 0 : Math.sin(t * .2) * .05);
  const phi   = orbitPhi   + (isMobile ? 0 : Math.cos(t * .15) * .02);
  camera.position.set(
    camTgt.x + radius * Math.sin(phi) * Math.sin(theta),
    camTgt.y + radius * Math.cos(phi),
    camTgt.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(camTgt);

  if (emojiMesh) {
    emojiMesh.position.y = Math.sin(t * .7) * .18;
    emojiMesh.rotation.z = Math.sin(t * .45) * .03;
  }

  for (let i = 0; i < RAIN_N; i++) {
    rPos[i*6+1] -= rSpeeds[i] * .5;
    rPos[i*6+4] -= rSpeeds[i] * .5;
    if (rPos[i*6+4] < -12) resetRainDrop(i, false);
  }
  rGeo.attributes.position.needsUpdate = true;

  mouseVel *= 0.78;
  ripplePass.uniforms.uVelocity.value = mouseVel;
  rippleSpawnTimer += dt;
  const spawnInterval = Math.max(0.045, 0.12 - mouseVel * 0.001);
  if (mouseVel > 3 && rippleSpawnTimer > spawnInterval) {
    ripplePositions[rippleIdx].set(
      ripplePass.uniforms.uMouse.value.x,
      ripplePass.uniforms.uMouse.value.y
    );
    rippleAges[rippleIdx] = 0.001;
    rippleIdx = (rippleIdx + 1) % MAX_RIPPLES;
    rippleSpawnTimer = 0;
  }
  for (let i = 0; i < MAX_RIPPLES; i++) {
    if (rippleAges[i] > 0) rippleAges[i] += dt;
    if (rippleAges[i] > 2.8) rippleAges[i] = 0;
  }

  for (let i = 0; i < BURST_N; i++) {
    if (!bActive[i]) { bPos[i*3+1] = -999; continue; }
    bLife[i] += dt;
    if (bLife[i] > bMax[i]) { bActive[i] = 0; bPos[i*3+1] = -999; continue; }
    bPos[i*3]   += bVel[i*3];
    bPos[i*3+1] += bVel[i*3+1]; bVel[i*3+1] -= .002;
    bPos[i*3+2] += bVel[i*3+2];
  }
  bGeo.attributes.position.needsUpdate = true;

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i]; sw.life += dt;
    const p = sw.life / 1.1;
    sw.m.scale.setScalar(1 + p * 9);
    sw.m.material.opacity = Math.max(0, .9 * (1 - p));
    if (sw.life > 1.1) { scene.remove(sw.m); shockwaves.splice(i, 1); }
  }

  composer.render();
})();

// ─── Video loader scene ───────────────────────────────────────────────────────
let _loaderRaf = null, _loaderRenderer = null;

function initLoaderScene() {
  const canvas = document.getElementById('cryify-loader-canvas');
  const wrap   = document.getElementById('cryify-video-loader');
  const W = wrap.offsetWidth  || 640;
  const H = wrap.offsetHeight || Math.round(W * 9 / 16);
  canvas.width  = W;
  canvas.height = H;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  _loaderRenderer = renderer;

  const scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x020408);
  scene.fog = new THREE.FogExp2(0x020408, 0.1);

  const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 50);
  camera.position.set(0, 0.1, 3.8);

  // Lights
  scene.add(new THREE.AmbientLight(0x5b9cf6, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(2, 4, 3); scene.add(key);
  const fill = new THREE.PointLight(0x5b9cf6, 1.2, 12);
  fill.position.set(-2, 1, 2); scene.add(fill);
  const back = new THREE.PointLight(0x88ccff, 0.6, 8);
  back.position.set(0, -2, -3); scene.add(back);

  // Tear rain particles
  const N = 140;
  const pa = new Float32Array(N * 3);
  const vel = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pa[i*3]   = (Math.random() - 0.5) * 6;
    pa[i*3+1] = Math.random() * 7 - 2;
    pa[i*3+2] = (Math.random() - 0.5) * 3 - 1;
    vel[i] = 0.025 + Math.random() * 0.05;
  }
  const tearGeo = new THREE.BufferGeometry();
  tearGeo.setAttribute('position', new THREE.BufferAttribute(pa, 3));
  const tearMat = new THREE.PointsMaterial({ color: 0x88ccff, size: 0.055, transparent: true, opacity: 0.78, sizeAttenuation: true });
  const tears = new THREE.Points(tearGeo, tearMat);
  scene.add(tears);

  // Pulsing glow ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.92, 0.014, 8, 80),
    new THREE.MeshBasicMaterial({ color: 0x5b9cf6, transparent: true, opacity: 0.35 })
  );
  scene.add(ring);

  // Post-processing
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.5, 0.15));
  composer.addPass(new OutputPass());

  // Load 3D emoji
  let emoji = null;
  new GLTFLoader().load('./uohh_emoji_crying_sob.glb', gltf => {
    emoji = gltf.scene;
    emoji.scale.setScalar(1.35);
    emoji.position.set(0, -0.15, 0);
    scene.add(emoji);
  });

  // Animate
  let t = 0;
  function tick() {
    _loaderRaf = requestAnimationFrame(tick);
    t += 0.016;

    if (emoji) {
      emoji.rotation.y = -Math.PI / 2 + Math.sin(t * 0.45) * 0.28;
      emoji.position.y = -0.15 + Math.sin(t * 4.2) * 0.055 - Math.abs(Math.sin(t * 2.1)) * 0.045;
    }

    ring.rotation.z += 0.009;
    ring.material.opacity = 0.18 + Math.sin(t * 2.2) * 0.14;
    const rs = 1 + Math.sin(t * 1.6) * 0.06;
    ring.scale.set(rs, rs, 1);

    const p = tears.geometry.attributes.position;
    for (let i = 0; i < N; i++) {
      p.array[i*3+1] -= vel[i];
      if (p.array[i*3+1] < -3.5) {
        p.array[i*3+1] = 4;
        p.array[i*3]   = (Math.random() - 0.5) * 5;
      }
    }
    p.needsUpdate = true;
    composer.render();
  }
  tick();
}

function disposeLoaderScene() {
  if (_loaderRaf)      { cancelAnimationFrame(_loaderRaf); _loaderRaf = null; }
  if (_loaderRenderer) { _loaderRenderer.dispose(); _loaderRenderer = null; }
  const loader = document.getElementById('cryify-video-loader');
  if (loader) loader.style.display = 'none';
}

// ─── CRY-IFY logic ────────────────────────────────────────────────────────────
(function () {
  const urlInput     = document.getElementById('cryify-url');

  const dropEl       = document.getElementById('cryify-drop');
  const fileInput    = document.getElementById('cryify-file');
  const previewEl    = document.getElementById('cryify-preview');
  const changeBtn    = document.getElementById('cryify-change');
  const dropInner    = document.getElementById('cryify-drop-inner');
  const submitBtn    = document.getElementById('cryify-submit');
  const errorEl      = document.getElementById('cryify-error');
  const uploadScreen = document.getElementById('cryify-upload-screen');
  const genScreen    = document.getElementById('cryify-gen-screen');
  const resultScreen = document.getElementById('cryify-result-screen');
  const genStatusEl  = document.getElementById('cryify-gen-status');
  const progressFill = document.getElementById('cryify-progress-fill');
  let selectedFile = null, currentResult = null;

  function getUrl() { return urlInput.value.trim().replace(/\/$/, ''); }

  function setFile(file) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const ratio = img.naturalWidth / img.naturalHeight;
      dropEl.style.aspectRatio = ratio;
      dropEl.classList.add('has-image');
    };
    img.src = url;
    previewEl.src = url; previewEl.style.display = 'block';
    dropInner.style.display = 'none'; changeBtn.style.display = 'block';
    submitBtn.disabled = false;
    errorEl.style.display = 'none';
  }

  dropEl.addEventListener('click', e => {
    if (e.target === changeBtn || changeBtn.contains(e.target)) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
  changeBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });

  dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag-over'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag-over'));
  dropEl.addEventListener('drop', e => {
    e.preventDefault(); dropEl.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setFile(f);
  });

  function showScreen(name) {
    uploadScreen.style.display = name === 'upload' ? 'flex' : 'none';
    genScreen.style.display    = name === 'gen'    ? 'flex' : 'none';
    resultScreen.style.display = name === 'result' ? 'flex' : 'none';
  }

  const GEN_MESSAGES = [
    'INITIALIZING TEAR DUCTS...', 'LOADING EMOTIONAL DAMAGE...',
    'APPLYING MAXIMUM SADNESS...', 'COMPUTING GRIEF LEVELS...',
    'RENDERING TEARS IN 4K...', 'FINALIZING EXISTENTIAL CRISIS...'
  ];

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile || submitBtn.disabled) return;
    submitBtn.disabled = true;
    errorEl.style.display = 'none';
    showScreen('gen');
    progressFill.style.width = '0%';
    let msgIdx = 0;
    genStatusEl.textContent = GEN_MESSAGES[0];
    let pct = 0;
    const interval = setInterval(() => {
      pct = Math.min(pct + (Math.random() * 8 + 2), 88);
      progressFill.style.width = pct + '%';
      msgIdx = (msgIdx + 1) % GEN_MESSAGES.length;
      genStatusEl.textContent = GEN_MESSAGES[msgIdx];
    }, 900);
    try {
      // Compress on client before upload — mobile photos can be 10MB+ which kills mobile connections
      const compressed = await new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const MAX = 900;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          else if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(resolve, 'image/jpeg', 0.82);
        };
        img.src = URL.createObjectURL(selectedFile);
      });

      const form = new FormData();
      form.append('image', compressed, 'photo.jpg');
      const res = await fetch(getUrl() + '/generate', { method: 'POST', body: form });
      clearInterval(interval);
      if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Generation failed'); }
      const data = await res.json();
      progressFill.style.width = '100%';
      currentResult = data;
      setTimeout(() => showResult(data), 320);
      // Immediately prepend to live feed (backend returns jobId, not id)
      prependFeedItem({ id: data.jobId || data.id, result_image: data.result_image, created_at: data.created_at || new Date().toISOString() });
    } catch (err) {
      clearInterval(interval);
      showScreen('upload');
      submitBtn.disabled = false;
      const isNetwork = /load failed|failed to fetch|networkerror/i.test(err.message || '');
      errorEl.textContent = isNetwork ? 'Connection failed — please try again.' : (err.message || 'Something went wrong.');
      errorEl.style.display = 'block';
    }
  });

  function showResult(data) {
    document.getElementById('cryify-result-before').src = URL.createObjectURL(selectedFile);
    document.getElementById('cryify-result-after').src = data.result_image;
    const analysisEl = document.getElementById('cryify-analysis');
    if (data.analysis) {
      analysisEl.textContent = data.analysis;
      analysisEl.style.display = 'block';
    }
    showScreen('result');
  }

  let toastEl = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'cryify-toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function downloadImage(url, filename) {
    const proxied = url.replace('https://cryify-api-production.up.railway.app', '');
    const a = document.createElement('a');
    a.href = proxied;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1000);
  }

  document.getElementById('cryify-download').addEventListener('click', () => {
    if (!currentResult) return;
    downloadImage(currentResult.result_image, 'cryify-result.png');
    toast('Downloading...');
  });
  document.getElementById('cryify-try-again').addEventListener('click', () => {
    showScreen('upload');
    submitBtn.disabled = false;
    currentResult = null;
    dropEl.style.aspectRatio = '';
    dropEl.classList.remove('has-image');
    disposeLoaderScene();
    videoSection.style.display = 'none';
    videoPlayer.style.display = 'none';
    videoPlayer.src = '';
    videoDlWrap.style.display = 'none';
    makeVideoBtn.disabled = false;
    makeVideoBtn.textContent = '🎬 Make Video';
    videoUrl = null;
  });

  // ─── GIF generation ─────────────────────────────────────────────────────────
  const makeGifBtn  = document.getElementById('cryify-make-gif');
  const gifSection  = document.getElementById('cryify-gif-section');
  const gifLoader   = document.getElementById('cryify-gif-loader');
  const gifPlayer   = document.getElementById('cryify-gif-player');
  const gifDlWrap   = document.getElementById('cryify-gif-dl-wrap');
  const gifDlBtn    = document.getElementById('cryify-gif-download');
  let currentGifUrl = null;

  makeGifBtn.addEventListener('click', async () => {
    if (!currentResult) return;
    makeGifBtn.disabled = true;
    makeGifBtn.textContent = '⏳ Making GIF...';

    // show loader, hide previous result
    gifSection.style.display = 'block';
    gifLoader.style.display = 'block';
    gifPlayer.style.display = 'none';
    gifDlWrap.style.display = 'none';

    try {
      const isMobile = window.innerWidth < 768;
      const form = new FormData();
      form.append('sourceJobId', currentResult.jobId);
      form.append('mobile', String(isMobile));

      const res  = await fetch(getUrl() + '/generate-gif', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'GIF failed');

      currentGifUrl = data.url;
      gifPlayer.src = data.url.replace('https://cryify-api-production.up.railway.app', '');
      gifLoader.style.display = 'none';
      gifPlayer.style.display = 'block';
      gifDlWrap.style.display = 'block';
      makeGifBtn.textContent = '✅ GIF Ready!';
      setTimeout(() => {
        makeGifBtn.disabled = false;
        makeGifBtn.textContent = '🌀 Make GIF';
      }, 3000);
    } catch (err) {
      gifLoader.textContent = '❌ GIF generation failed';
      makeGifBtn.disabled = false;
      makeGifBtn.textContent = '🌀 Make GIF';
    }
  });

  gifDlBtn.addEventListener('click', () => {
    if (!currentGifUrl) return;
    downloadImage(currentGifUrl, 'cryify.gif');
  });

  // ─── Video generation ───────────────────────────────────────────────────────
  const makeVideoBtn    = document.getElementById('cryify-make-video');
  const videoSection    = document.getElementById('cryify-video-section');
  const videoStatus     = document.getElementById('cryify-video-status');
  const videoPlayer     = document.getElementById('cryify-video-player');
  const videoDlWrap     = document.getElementById('cryify-video-dl-wrap');
  const videoDlBtn      = document.getElementById('cryify-video-download');
  let videoUrl = null;

  makeVideoBtn.addEventListener('click', async () => {
    if (!currentResult) return;
    makeVideoBtn.disabled = true;
    makeVideoBtn.textContent = '⏳ Generating...';
    videoSection.style.display = 'block';
    document.getElementById('cryify-video-loader').style.display = 'block';
    videoPlayer.style.display = 'none';
    videoDlWrap.style.display = 'none';
    videoStatus.textContent = 'Submitting to MiniMax...';
    setTimeout(initLoaderScene, 50); // wait for DOM to paint

    try {
      const form = new FormData();
      form.append('sourceJobId', currentResult.jobId);
      const res = await fetch(getUrl() + '/generate-video', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to start video');

      const { videoJobId } = data;
      videoStatus.textContent = 'Generating video — 2 to 4 minutes...';

      const poll = setInterval(async () => {
        try {
          const sr = await fetch(`${getUrl()}/video-status/${videoJobId}`);
          const s = await sr.json();
          if (s.status === 'done') {
            clearInterval(poll);
            disposeLoaderScene();
            videoUrl = s.url;
            videoPlayer.src = s.url;
            videoPlayer.style.display = 'block';
            videoDlWrap.style.display = 'block';
            makeVideoBtn.textContent = '✅ Done';
          } else if (s.status === 'error') {
            clearInterval(poll);
            disposeLoaderScene();
            videoStatus.textContent = '❌ ' + (s.error || 'Video generation failed');
            document.getElementById('cryify-video-loader').style.display = 'block';
            makeVideoBtn.disabled = false;
            makeVideoBtn.textContent = '🎬 Make Video';
          }
        } catch {}
      }, 10000);
    } catch (err) {
      disposeLoaderScene();
      videoStatus.textContent = '❌ ' + err.message;
      document.getElementById('cryify-video-loader').style.display = 'block';
      makeVideoBtn.disabled = false;
      makeVideoBtn.textContent = '🎬 Make Video';
    }
  });

  videoDlBtn.addEventListener('click', () => {
    if (!videoUrl) return;
    const a = document.createElement('a');
    a.href = videoUrl; a.download = 'cryify-video.mp4'; a.click();
  });

  // expose downloadImage for feed use
  window.downloadImage = downloadImage;
})();

// ─── Live feed ────────────────────────────────────────────────────────────────
(function () {
  const feedGrid  = document.getElementById('feed-grid');
  const feedEmpty = document.getElementById('feed-empty');
  const seenIds   = new Set();
  const seenUrls  = new Set();

  function relTime(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if (diff < 5)   return 'just now';
    if (diff < 60)  return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  // ── Lightbox ──
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxDl  = document.getElementById('lightbox-dl');
  let   lightboxSrc = '';

  function openLightbox(src) {
    lightboxSrc = src;
    lightboxImg.src = src;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lightboxImg.src = '';
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  lightboxDl.addEventListener('click', () => {
    if (lightboxSrc) window.downloadImage(lightboxSrc, 'cryify-meme.png');
  });

  function createCard(item) {
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div class="feed-item-img-wrap">
        <img class="feed-item-img" src="${item.result_image}" alt="Cry-ified meme" loading="lazy" crossorigin="anonymous">
        <div class="feed-item-overlay">
          <button class="feed-overlay-btn" title="View full size">⤢</button>
          <button class="feed-overlay-btn feed-overlay-dl" title="Download">↓</button>
        </div>
      </div>
      <div class="feed-item-meta">
        <span class="feed-item-label">😭 CRY-IFY</span>
        <span class="feed-item-time">${relTime(item.created_at)}</span>
      </div>`;

    // expand button → lightbox
    el.querySelector('.feed-item-img-wrap').addEventListener('click', e => {
      if (e.target.classList.contains('feed-overlay-dl')) return;
      openLightbox(item.result_image);
    });
    // download button
    el.querySelector('.feed-overlay-dl').addEventListener('click', e => {
      e.stopPropagation();
      window.downloadImage(item.result_image, 'cryify-meme.png');
    });
    // mobile: tap card opens lightbox (ignore scroll gestures)
    let _tsx = 0, _tsy = 0;
    el.addEventListener('touchstart', e => {
      _tsx = e.touches[0].clientX; _tsy = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', e => {
      const dx = Math.abs(e.changedTouches[0].clientX - _tsx);
      const dy = Math.abs(e.changedTouches[0].clientY - _tsy);
      if (dx > 10 || dy > 10) return;
      if (e.target.classList.contains('feed-overlay-dl')) return;
      openLightbox(item.result_image);
    }, { passive: true });

    return el;
  }

  window.prependFeedItem = function(item) {
    if ((item.id && seenIds.has(item.id)) || seenUrls.has(item.result_image)) return;
    if (item.id) seenIds.add(item.id);
    seenUrls.add(item.result_image);
    feedEmpty.style.display = 'none';
    const card = createCard(item);
    feedGrid.prepend(card);
  };

  async function pollFeed() {
    const urlInput = document.getElementById('cryify-url');
    const base = urlInput ? urlInput.value.trim().replace(/\/$/, '') : '';
    if (!base) return;
    try {
      const res = await fetch(base + '/history', { signal: AbortSignal.timeout(4000) });
      if (!res.ok) return;
      const data = await res.json();
      const items = (data.images || []).slice().reverse(); // oldest first so prepend gives newest-first
      items.forEach(item => {
        if ((item.id && seenIds.has(item.id)) || seenUrls.has(item.result_image)) return;
        if (item.id) seenIds.add(item.id);
        seenUrls.add(item.result_image);
        feedEmpty.style.display = 'none';
        feedGrid.prepend(createCard(item));
      });
    } catch { /* backend offline — silent */ }
  }

  pollFeed();
  setInterval(pollFeed, 4000);
})();
</script>
